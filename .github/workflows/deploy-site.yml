name: Deploy the Onceaway site

# Builds the marketing site and publishes it to GitHub Pages.
#
# Nothing here needs a secret: the built-in Pages token is enough, so no
# personal access token is created or stored anywhere.
#
# This file is mirrored from the private repository by
# Scripts/publish-marketing-site.sh. Edit it there, not here.

on:
  push:
    branches: [main]
    paths:
      - 'Website/**'
      - 'Docs/Releases/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# The least the Pages actions need, and nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run supersedes an older queued one, but a
# run already publishing is allowed to finish rather than being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Website/package-lock.json

      - name: Install dependencies
        working-directory: Website
        run: npm ci

      - name: Run the site tests
        working-directory: Website
        run: npm test

      - name: Build the site
        working-directory: Website
        env:
          # A GitHub project page is served from /<repository>/, so every
          # generated link is built against that base.
          SITE_BASE: /${{ github.event.repository.name }}/
          # The owner is lower-cased: Pages serves from a lower-case hostname,
          # and a canonical URL should be the address people actually reach.
          OWNER: ${{ github.repository_owner }}
          # Preview: reachable by URL, not offered to search engines. This is
          # not access control — see the README.
          SITE_INDEXING: 'false'
        run: |
          export SITE_ORIGIN="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io"
          echo "Building against $SITE_ORIGIN$SITE_BASE"
          npm run build

      - name: Refuse to publish a tester build
        working-directory: Website
        run: |
          if grep -rniE '\.dmg|onceaway-0\.[0-9]' dist/; then
            echo "::error::the built site names a tester artifact"
            exit 1
          fi
          echo "no tester artifact is named in the built site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
